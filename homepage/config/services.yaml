- Tools:
    - System Stats:
        icon: raspberry-pi.png
        href: http://grafana.pi/d/rYdddlPWk/node-exporter-full
        description: Pi system monitoring
    - Prometheus:
        icon: prometheus.png
        href: http://prometheus.pi
        description: Raw metrics
        siteMonitor: http://prometheus:9090

- News:
    - FreshRSS:
        icon: freshrss.png
        href: http://freshrss.pi
        description: RSS feeds
        # Su raiz redirige a /i/?rid=<sesion>, que sin sesion corta la conexion
        # y se ve como "socket hang up". El favicon contesta 200 limpio y sirve
        # igual para saber si esta vivo.
        siteMonitor: http://freshrss:80/favicon.ico
    - Wallabag:
        icon: wallabag.png
        href: http://wallabag.pi
        description: Saved articles
        siteMonitor: http://wallabag:80
    - News Filter:
        icon: mdi-filter
        href: http://news.pi
        description: Manage keywords & view runs
        siteMonitor: http://news-filter-ui:8084

- Finance:
    - Finance Tracker:
        icon: mdi-credit-card
        href: http://finance.pi
        description: Movimientos bancarios (email + PDF uploads)
        siteMonitor: http://finance-tracker-ui:8085
    - Finance Dashboard:
        icon: mdi-chart-bar
        href: http://grafana.pi/d/finance-main
        description: Dashboards de gastos en Grafana
