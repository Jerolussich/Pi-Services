# Un solo numero que dice si hace falta abrir algo. Verde significa no abras
# nada, y esa es toda su funcion.
#
# Lo escribe el diagnostico cada hora y lo sirve Caddy como archivo estatico,
# asi que aca no hay ningun servicio nuevo detras: es un JSON de tres campos.
- Estado:
    - Salud del Pi:
        icon: mdi-heart-pulse
        href: http://eventos.pi
        description: Feed de eventos y estado general
        widget:
          type: customapi
          url: http://caddy/estado.json
          refreshInterval: 60000
          mappings:
            - field: salud
              label: Salud
              format: number
            - field: problemas
              label: Para mirar
              format: number
            - field: actualizado
              label: Al

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.pi
        description: Reproducir peliculas y series
        siteMonitor: http://jellyfin:8096
        # El recuadro estaba apagado y solo se veia el puntito de "esta vivo".
        # Con la clave, muestra quien esta reproduciendo ahora y el tamano de
        # la biblioteca, que es lo que se queria de la pantalla de media.
        # La clave la crea y la escribe el instalador: nunca pasa por tus manos.
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: jellyseerr.png
        href: http://seerr.pi
        description: Pedir peliculas y series
        siteMonitor: http://seerr:5055
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Radarr:
        icon: radarr.png
        href: http://radarr.pi
        description: Agregar y automatizar peliculas
        siteMonitor: http://radarr:7878
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Sonarr:
        icon: sonarr.png
        href: http://sonarr.pi
        description: Agregar y automatizar series
        siteMonitor: http://sonarr:8989
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - qBittorrent:
        icon: qbittorrent.png
        href: http://qbit.pi
        description: Descargas en curso
        siteMonitor: http://qbittorrent:8080
        # No tiene clave de API: se entra con usuario y contrasena, asi que el
        # instalador reusa la que le acaba de poner en vez de preguntartela.
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
    - Bazarr:
        icon: bazarr.png
        href: http://bazarr.pi
        description: Subtitulos automaticos
        siteMonitor: http://bazarr:6767
    - Prowlarr:
        icon: prowlarr.png
        href: http://prowlarr.pi
        description: Indexers (se configura una vez)
        siteMonitor: http://prowlarr:9696

- Casa:
    - Home Assistant:
        icon: home-assistant.png
        href: http://casa.pi
        description: Luces, sensores y automatizaciones
        siteMonitor: http://192.168.68.66:8123
        # El recuadro con datos en vivo (cuantas luces prendidas, etc.) necesita
        # un token de HA, y ese token solo existe DESPUES de crear tu usuario,
        # asi que el instalador no puede leerlo como lee los de Radarr o Seerr.
        # Si lo queres: en casa.pi, tu perfil, abajo de todo, "Crear token",
        # pegalo en homepage/.env como HOMEPAGE_VAR_HA_TOKEN y descomenta esto.
        # widget:
        #   type: homeassistant
        #   url: http://192.168.68.66:8123
        #   key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

- Network:
    - Pi-hole:
        icon: pi-hole.png
        href: http://pihole.pi/admin
        description: Network-wide ad blocking
        # Sin siteMonitor a proposito, y no por vagancia.
        #
        # El servidor web de Pi-hole arma sus respuestas de una forma que el
        # parser HTTP de la homepage rechaza: "Parse Error: Data after
        # Connection: close". Pasa con /admin, con /admin/ y hasta con
        # /admin/login, que devuelve un 200 perfectamente normal para curl.
        # No es el redirect: es como cierra la conexion.
        #
        # El resultado seria un puntito rojo permanente sobre un servicio que
        # anda perfecto. Un indicador que siempre miente es peor que ninguno:
        # te acostumbras a ignorarlo y el dia que algo se cae de verdad, ya no
        # lo estas mirando. Si queres saber si Pi-hole esta vivo, el
        # diagnostico lo comprueba resolviendo un nombre, que es la pregunta
        # que de verdad importa.
    - Grafana:
        icon: grafana.png
        href: http://grafana.pi
        description: Monitoring dashboards
        siteMonitor: http://grafana:3000

- FitbitDashboard:
    - Fitbit:
        icon: mdi-heart-pulse
        href: http://grafana.pi/d/fitbit-main-dashboard
