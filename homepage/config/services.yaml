- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.pi
        description: Reproducir peliculas y series
        siteMonitor: http://jellyfin:8096
    - Seerr:
        icon: jellyseerr.png
        href: http://seerr.pi
        description: Pedir peliculas y series
        siteMonitor: http://seerr:5055
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Radarr:
        icon: radarr.png
        href: http://radarr.pi
        description: Agregar y automatizar peliculas
        siteMonitor: http://radarr:7878
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Sonarr:
        icon: sonarr.png
        href: http://sonarr.pi
        description: Agregar y automatizar series
        siteMonitor: http://sonarr:8989
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - qBittorrent:
        icon: qbittorrent.png
        href: http://qbit.pi
        description: Descargas en curso
        siteMonitor: http://qbittorrent:8080
    - Bazarr:
        icon: bazarr.png
        href: http://bazarr.pi
        description: Subtitulos automaticos
        siteMonitor: http://bazarr:6767
    - Prowlarr:
        icon: prowlarr.png
        href: http://prowlarr.pi
        description: Indexers (se configura una vez)
        siteMonitor: http://prowlarr:9696

- Casa:
    - Home Assistant:
        icon: home-assistant.png
        href: http://casa.pi
        description: Luces, sensores y automatizaciones
        siteMonitor: http://192.168.68.66:8123
        # El recuadro con datos en vivo (cuantas luces prendidas, etc.) necesita
        # un token de HA, y ese token solo existe DESPUES de crear tu usuario,
        # asi que el instalador no puede leerlo como lee los de Radarr o Seerr.
        # Si lo queres: en casa.pi, tu perfil, abajo de todo, "Crear token",
        # pegalo en homepage/.env como HOMEPAGE_VAR_HA_TOKEN y descomenta esto.
        # widget:
        #   type: homeassistant
        #   url: http://192.168.68.66:8123
        #   key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

- Network:
    - Pi-hole:
        icon: pi-hole.png
        href: http://pihole.pi/admin
        description: Network-wide ad blocking
        siteMonitor: http://172.17.0.1:8181/admin
    - Grafana:
        icon: grafana.png
        href: http://grafana.pi
        description: Monitoring dashboards
        siteMonitor: http://grafana:3000

- FitbitDashboard:
    - Fitbit:
        icon: mdi-heart-pulse
        href: http://grafana.pi/d/fitbit-main-dashboard
        description: Actividad, sueño y ejercicios
    - FitbitInsights:
        icon: mdi-chart-line
        href: http://grafana.pi/d/fitbit-insights-dashboard
        description: Correlaciones y tendencias
    - Fitbit Ingest:
        icon: mdi-database-sync
        href: http://fitbit.pi
        description: Ingesta manual por mes
        siteMonitor: http://fitbit-exporter-ui:8086

- Tools:
