name: pi-services
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # Pone tini como PID 1 del contenedor, y con eso se terminan los zombies.
    #
    # El healthcheck corre un wget cada 10 segundos. Cuando alguno queda
    # huerfano lo adopta el PID 1, que aca es next-server: Next.js no esta
    # escrito para hacer de init y nunca lo recolecta, asi que el wget queda en
    # estado Z para siempre. El sintoma es el aviso "There is 1 zombie process"
    # en el cartel de bienvenida de Ubuntu, que no explica de donde sale.
    #
    # No hace falta en todos: wallabag arranca con s6-svscan, que ya recolecta.
    init: true
    # Sin esto, las HOMEPAGE_VAR_* del .env no entran al contenedor.
    #
    # Es una confusion facil de tener: Compose lee el .env de al lado para
    # sustituir variables en ESTE archivo, como el ${PI_IP} de aca abajo, pero
    # eso no las mete adentro del contenedor. Y el sintoma no ayuda: los
    # recuadros de Radarr, Sonarr y Seerr mandaban la clave vacia, cada
    # servicio contestaba 401 o 403, y la homepage mostraba "API Error" sin
    # decir que el problema era que la clave nunca habia llegado.
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.pi,${PI_IP}:3001
    volumes:
      - ./config:/app/config
    restart: unless-stopped

networks:
  default:
    name: pi-services
    external: true
