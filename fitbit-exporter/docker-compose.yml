name: pi-services
services:
  fitbit-exporter:
    build: .
    container_name: fitbit-exporter
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./exports:/app/exports
      - ./data:/app/data
      - ./export.py:/app/export.py:ro
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      # Seis campos: segundo minuto hora dia mes dia-de-semana.
      # Con cinco, esto corria todos los dias a la 01:06 en vez de una vez al mes.
      ofelia.job-exec.fitbit-exporter.schedule: "0 0 6 1 * *"
      ofelia.job-exec.fitbit-exporter.command: "python /app/export.py --source scheduled"

  fitbit-exporter-ui:
    build: ./ui
    container_name: fitbit-exporter-ui
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./exports:/app/exports
      - ./data:/app/data
      - ./export.py:/app/export.py:ro
    env_file:
      - ./ui/.env
    restart: unless-stopped

networks:
  default:
    name: pi-services
    external: true
