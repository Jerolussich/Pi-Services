#!/bin/bash
# ==============================================================================
#  ajustes.conf  ·  El unico lugar donde se tocan horarios y umbrales
#
#  Lo lee el diagnostico en cada corrida, asi que un cambio aca vale en la
#  corrida siguiente: sin reinstalar, sin recargar servicios, sin root.
#
#  POR QUE EXISTE ESTE ARCHIVO
#
#  Los horarios estaban repartidos en dos unidades de systemd y los umbrales
#  escritos a mano adentro del diagnostico. Para cambiar cada cuanto se miran
#  los discos habia que editar codigo. Ahora es una linea aca.
#
#  Es el mismo principio del Caddyfile: el dato vive en un lugar y el resto
#  se deriva.
#
#  ESTE ARCHIVO SI SE VERSIONA. No tiene secretos: los nombres de los canales
#  de ntfy viven en .env, que nunca se commitea.
# ==============================================================================

# ── Cuando corre cada cosa ────────────────────────────────────────────────────
#
# De aca salen los timers de systemd. No se editan las unidades a mano: el
# instalador las escribe con estos valores, igual que deriva los registros DNS
# del Caddyfile. Si cambias algo aca, volve a correr ./instalador.sh.

# Cada cuanto corre el diagnostico. Es la pulsacion de todo lo demas.
DIAGNOSTICO_CADA=1h

# A que hora corre el respaldo diario (0-23)
HORA_RESPALDO=4

# Cada cuantos minutos se revisa si hay una tanda de importaciones para avisar
MEDIA_CADA_MIN=5

# ── Cada cuanto corre lo pesado ───────────────────────────────────────────────
#
# El diagnostico corre cada hora y esa es la pulsacion. Lo que no necesita
# esa frecuencia declara la suya y se saltea el resto de las corridas.
#
# Los discos van cada 48 h y no cada hora a proposito: preguntarle a un disco
# como esta lo DESPIERTA. Un chequeo horario tendria los dos discos del DAS
# girando las 24 horas, o sea que la herramienta que los cuida seria la que
# los gasta.

# Cada cuantas horas se revisan SMART, el espacio del DAS y los huerfanos
CADA_CUANTO_DISCOS=48

# A que hora del dia, preferentemente (0-23). De madrugada no molesta a nadie.
HORA_DISCOS=4

# Cada cuantas horas se compara lo que dice Radarr contra lo que hay en disco
CADA_CUANTO_BIBLIOTECA=48
HORA_BIBLIOTECA=5

# ── Avisos al celular ─────────────────────────────────────────────────────────

# De noche solo pasa lo grave. Un aviso menor que te despierta es un aviso
# que termina con el canal silenciado, y ahi volviste a no tener canal.
SILENCIO_DESDE=0
SILENCIO_HASTA=8

# Un problema que sigue igual no vuelve a avisar. Pero si pasan estas horas y
# ahi sigue, avisa una vez mas para que no se te olvide. Poner 0 lo desactiva.
RECORDAR_CADA_HORAS=24

# ── Avisos de media ───────────────────────────────────────────────────────────
#
# Las importaciones no se avisan de a una: se espera a que la tanda termine y
# sale un solo mensaje. Sin esto, un pack de temporada son ocho notificaciones
# seguidas.

# Minutos sin nuevas importaciones para dar la tanda por cerrada
MEDIA_ESPERA_MIN=3

# Avisar tambien cuando Radarr o Sonarr REEMPLAZAN un archivo por uno mejor.
# En 0 se descartan: que te cambien un 720p por un 1080p de algo que ya tenias
# no es una novedad, y el perfil de calidad que mejora solo las dispara seguido.
MEDIA_AVISAR_MEJORAS=0

# ── Feed de eventos ───────────────────────────────────────────────────────────

# Cuantas lineas se conservan. El feed se corta solo y no usa logrotate: fue
# justamente logrotate el que se murio en silencio y dejo crecer un log hasta
# llenar la tarjeta. Mil lineas son unos 100 KB, o sea meses de historia.
FEED_LINEAS=1000

# ── Umbrales del equipo ───────────────────────────────────────────────────────

# Tarjeta del sistema, en porcentaje usado
DISCO_OJO=75
DISCO_MAL=90

# Temperatura de la Pi, en grados
TEMP_OJO=80

# ── Umbrales del DAS ──────────────────────────────────────────────────────────

# Porcentaje usado de cada disco del DAS
DAS_OJO=85
DAS_MAL=95

# Temperatura de cada disco del DAS, en grados
DISCO_TEMP_OJO=50

# Cuantos GB recuperables en descargas hacen falta para que valga la pena avisar
HUERFANOS_GB=50

# Cuantos dias tiene que llevar una descarga sin importarse para contarla como
# huerfana. Por debajo de esto puede ser una importacion en curso.
HUERFANOS_DIAS=7

# ── Umbrales de red ───────────────────────────────────────────────────────────

# Contra quien se mide. Una IP y no un nombre, para no medir tambien al DNS.
PING_DESTINO=1.1.1.1

# Cuantos paquetes por corrida. Diez alcanzan para un porcentaje con sentido
# y tardan diez segundos.
PING_PAQUETES=10

# Milisegundos de latencia promedio a partir de los cuales avisa
LATENCIA_OJO=150

# Porcentaje de paquetes perdidos a partir del cual avisa
PERDIDA_OJO=5
