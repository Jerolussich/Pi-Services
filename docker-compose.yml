name: pi-services
include:
  - monitoring/docker-compose.yml
  - homepage/docker-compose.yml
  - fitbit-exporter/docker-compose.yml
  - news/freshrss/docker-compose.yml
  - news/wallabag/docker-compose.yml
  - news/news-filter/docker-compose.yml
  - finance/finance-tracker/docker-compose.yml
  - caddy/docker-compose.yml
  - ofelia/docker-compose.yml
  - media/docker-compose.yml
  - home/docker-compose.yml
networks:
  default:
    name: pi-services
  # La red de qBittorrent, aparte del resto. Es el unico contenedor que habla
  # con desconocidos de internet y, con el puerto abierto, el unico al que se
  # le puede llamar desde afuera: si alguien lo vulnerara, desde esta red solo
  # alcanza a quienes realmente le hablan (Radarr, Sonarr, Caddy y la
  # homepage) y no a los otros veinte contenedores. Ver media/README.md.
  torrent:
    name: pi-torrent
