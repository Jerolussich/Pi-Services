name: pi-services
# Home Assistant.
#
# Sube junto con el resto del stack, con el mismo `docker compose up -d`.
#
# POR QUE ESTE VA EN LA RED DEL HOST
#
# Es el unico contenedor del repo que no esta en la red pi-services, y no es un
# descuido. Home Assistant descubre los dispositivos de la casa por mDNS, SSDP y
# DHCP, que son protocolos de difusion: no atraviesan el puente de Docker. En la
# red del puente arranca igual y anda, pero no encuentra nada solo y hay que
# cargar cada dispositivo a mano por IP, que es justo el trabajo que uno quiere
# evitar.
#
# Y no rompe la arquitectura, porque no es la primera vez: Caddy ya proxea un
# servicio del host, el panel de Pi-hole en el 8181. La regla real de este repo
# no es "todo en la red del puente", es "nada se expone a la red de casa salvo
# por Caddy en el 80", y eso se sigue cumpliendo: el 8123 queda cerrado por UFW
# igual que el 8181, y solo Caddy llega.
services:
  homeassistant:
    # SI VOLVES A CORRER ESTO EN UNA RASPBERRY PI 5, LEE ESTO ANTES.
    #
    # Estuvo clavada en 2026.6.4 por un problema que es SOLO de la Pi 5, no de
    # Home Assistant: de 2026.7.0 en adelante la imagen se construye sobre Alpine
    # 3.24, que trae musl 1.2.6, y musl 1.2.6 no puede relocalizar sus librerias
    # con el kernel de paginas de 16 KB de la Pi 5. El contenedor entra en bucle
    # de reinicio con "Error relocating _ssl...: X509_up_ref: symbol not found".
    # Se reproduce con alpine:3.24 pelado, sin Home Assistant en el medio:
    #
    #   docker run --rm alpine:3.24 /lib/ld-musl-aarch64.so.1 --list /usr/lib/libcrypto.so.3
    #
    # Nada de eso pasa en amd64, que es donde corre hoy: el enlazador es otro y
    # las paginas son de 4 KB. Por eso vuelve a :stable.
    #
    # El pin quedo mintiendo un tiempo, y esa es la parte que no hay que repetir:
    # el archivo decia 2026.6.4 mientras el contenedor corria 2026.9.1, porque se
    # habia levantado con :stable. Es peligroso justamente al reves de como
    # suena: el que quedaba desactualizado era el archivo, y el primer
    # "docker compose up -d" de rutina iba a BAJAR Home Assistant tres meses
    # sobre un /config ya escrito por la version nueva. Hacia atras no migra.
    #
    # Si volves a arm64 con paginas de 16 KB, comproba primero que el comando de
    # arriba de cero errores. Si los da, hay que pinear de nuevo, y esta vez
    # levantando de verdad con el pin puesto.
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./config:/config
      # Para que los horarios de las automatizaciones sean los tuyos
      - /etc/localtime:/etc/localtime:ro
      # Necesario para que descubra dispositivos por DBus, como el Bluetooth
      - /run/dbus:/run/dbus:ro
    # Se le da acceso al hardware de la Pi, que es para lo que sirve tenerlo
    # en casa y no en la nube de otro.
    privileged: true
    restart: unless-stopped
