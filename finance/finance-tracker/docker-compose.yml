name: pi-services
services:
  itau-email-tracker:
    build:
      context: ./tracker
      dockerfile: Dockerfile
    container_name: itau-email-tracker
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      # SEIS campos, y el primero son SEGUNDOS. Con los cinco de cron clasico
      # Ofelia lee "0 * * * *" como segundo 0 de cada minuto, o sea que esto
      # corria CADA MINUTO en vez de cada hora: 60 veces las escrituras
      # previstas sobre la tarjeta, y fallando todas.
      ofelia.job-exec.itau-email-tracker.schedule: "0 0 * * * *"
      ofelia.job-exec.itau-email-tracker.command: "python /app/fetch.py"
  finance-tracker-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: finance-tracker-ui
    volumes:
      - ./data:/app/data
      - ./tracker/fetch.py:/app/fetch.py:ro
    env_file:
      - .env
    restart: unless-stopped
networks:
  default:
    name: pi-services
    external: true
