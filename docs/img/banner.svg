      <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="84" y="25" text-anchor="middle">Home Assistant</text>
    </g>
    <g transform="translate(786 262)">
      <rect width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="59" y="25" text-anchor="middle">Grafana</text>
    </g>
    <g transform="translate(916 262)">
      <rect width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="54" y="25" text-anchor="middle">Caddy</text>
