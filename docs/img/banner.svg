    <g transform="translate(1036 262)">
      <rect width="148" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/><text x="74" y="25" text-anchor="middle">Tailscale</text>
