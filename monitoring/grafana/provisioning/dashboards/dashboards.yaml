apiVersion: 1
providers:
  # El tablero del equipo. Es UNO solo con filas colapsadas, y no cuatro
  # tableros separados de red, discos, seguridad y salud: una fila cerrada es
  # lo que deja que un tablero contenga cuatro sin ser cuatro.
  - name: Pi
    folder: Pi
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/pi

  - name: Fitbit
    folder: Fitbit
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/fitbit

  - name: Finance
    folder: Finance
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/finance

  - name: Pihole
    folder: Pihole
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/pihole

  # Node Exporter Full, el tablero 1860 de grafana.com. Antes estaba importado
  # a mano y vivia solo dentro del volumen, asi que se perdio con el. La
  # homepage enlaza a su UID rYdddlPWk, que se conserva a proposito.
  - name: System
    folder: System
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/system
