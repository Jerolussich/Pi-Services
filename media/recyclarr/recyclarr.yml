# Recyclarr: mantiene la calidad de Radarr y Sonarr al dia con la guia de TRaSH.
#
# TRaSH es la guia que la comunidad de los *arr mantiene sobre que releases
# conviene bajar: que grupos encodean bien, cuales son de baja calidad, que es
# un HDR de verdad y que no. Recyclarr la lee de su repositorio una vez por dia
# y le aplica a Radarr y Sonarr lo que aca se le pida. Si la comunidad descubre
# un grupo malo nuevo, llega solo, sin tocar nada.
#
# QUE TOCA Y QUE NO, a proposito:
#
#   - Solo el perfil "Perfeccionista", que es el que crea el instalador y el que
#     usan los pedidos de Seerr. Le suma formatos y puntajes.
#   - NO le cambia las calidades aceptadas ni la mejora por calidad: el perfil
#     se nombra solo para una cosa (que lo descargado no se reemplace por un
#     grupo mejor, ver abajo), y lo que no se nombra no se toca. Sigue
#     aceptando todo, para que una pelicula rara que solo existe en 480p igual
#     se baje.
#   - NO toca el formato "Upscaled" que crea el instalador. La guia tiene uno
#     con el mismo nombre, y Recyclarr adopta y PISA cualquier formato que se
#     llame igual que uno de la lista. El nuestro atrapa tambien "AI" y "Topaz",
#     que el de la guia no; por eso su trash_id no esta aca.
#   - Si un formato sale de esta lista o de la guia, se borra de Radarr/Sonarr
#     (delete_old_custom_formats). Solo los que creo Recyclarr: los nuestros no.
#
# COMO DECIDE RADARR: primero la calidad (2160p le gana a 1080p) y despues el
# puntaje, que desempata entre releases de la misma calidad. Por eso estos
# puntajes no cambian que tan grande es lo que se baja: eligen el MEJOR release
# dentro de cada calidad, y descartan los que tienen -10000 (el minimo del
# perfil es 0, cualquier negativo queda afuera).
#
# Los puntajes son los de la guia (score set "default"); no se fijan aca a mano
# para que, si la guia los ajusta, lleguen solos.
#
# Los identificadores salen de `recyclarr list custom-formats radarr|sonarr`.
# Las API keys no estan aca: las escribe el instalador en recyclarr/.env, que
# no se versiona. Ver media/README.md, seccion Recyclarr.

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    # Lo que ya esta descargado NO se reemplaza por tener un grupo mejor: solo
    # por una calidad mejor (1080p -> 2160p), que es como venia funcionando el
    # perfil. Sin esto, al aplicar la guia por primera vez, 11 peliculas y 8
    # episodios de grupos LQ quedaban con -10000 y Radarr salia a buscarles
    # reemplazo de la misma calidad (verificado: Inception, I Am Legend, El
    # Padrino III tenian candidatos aprobados; Hang 'em High iba a cambiar un
    # HDR por un SDR a 60 cuadros interpolados).
    #
    # El mecanismo: para mejorar SIN subir de calidad, Radarr y Sonarr exigen
    # que el puntaje nuevo supere al actual por al menos este numero. 100000 es
    # mas que cualquier diferencia posible entre dos releases, asi que esa
    # mejora no ocurre nunca. Las mejoras de calidad no miran este numero, y los
    # REPACK/PROPER del mismo release tampoco. El resto del perfil no se nombra
    # y por eso no se toca.
    quality_profiles:
      - name: Perfeccionista
        min_upgrade_format_score: 100000

    # SIN quality_definition, a proposito. La guia trae tamanos minimos por
    # calidad pensados para quien quiere lo mas grande: un Bluray-1080p de
    # menos de 50 MB por minuto (unos 6 GB para dos horas) quedaria rechazado.
    # Eso descartaria los buenos encodes x265 de 2 a 5 GB, que para una
    # pelicula rara pueden ser la unica version que existe, y el perfil
    # Perfeccionista esta armado justamente para no perderlas. Se probo con
    # --preview antes de decidirlo.

    custom_formats:
      # ── Descartar (-10000) ───────────────────────────────────────────────
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83 # BR-DISK: la imagen del disco entera
          - 90a6f9a284dff5103f6346090e6280c8 # LQ: grupos conocidos por releases malos
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - 0a3f082873eb454bde444150b70253cc # Extras: making-of y similares, no la pelicula
          - e6886871085226c3da1830830146846c # Generated Dynamic HDR: HDR dinamico inventado
          - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
          # Dolby Vision sin HDR10 debajo: en una tele sin Dolby Vision se ve
          # con colores violetas o verdes. Con esto se elige la version que trae
          # HDR10 de respaldo, que se ve bien en cualquier tele HDR.
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
        assign_scores_to:
          - name: Perfeccionista

      # ── Preferir: grupos que encodean bien ───────────────────────────────
      - trash_ids:
          - 3a3ff47579026e76d6504ebea39390de # Remux Tier 01
          - 9f98181fe5a3fbeb0cc29340da2a468a # Remux Tier 02
          - 8baaf0b3142bf4d94c42a724f034e27a # Remux Tier 03
          - 4d74ac4c4db0b64bff6ce0cffef99bf0 # UHD Bluray Tier 01
          - a58f517a70193f8e578056642178419d # UHD Bluray Tier 02
          - e71939fae578037e7aed3ee219bbe7c1 # UHD Bluray Tier 03
          - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
          - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
          - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
          - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
          - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
          - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
        assign_scores_to:
          - name: Perfeccionista

      # ── Preferir: correcciones y HDR real ────────────────────────────────
      - trash_ids:
          - e7718d7a3ce595f289bfee26adc178f5 # Repack/Proper: el grupo corrigio un error
          - ae43b294509409a6a13919dedd4764c4 # Repack2
          - 5caaaa1c08c1742aa4342d8c4cc463f2 # Repack3
          - 493b6d1dbec3c3364c59d7607f7e3405 # HDR
          - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost
          - caa37d0df9c348912df1fb1d88f9273a # HDR10+ Boost
        assign_scores_to:
          - name: Perfeccionista

      # ── Plataformas de streaming ─────────────────────────────────────────
      # Identifican de donde salio un WEB-DL. En Radarr la guia les da 0:
      # sirven para que se vea en la interfaz, y para que la guia pueda
      # preferir una sobre otra si algun dia lo decide.
      - trash_ids:
          - b3b3a6ac74ecbd56bcdbefa4799fb9df # AMZN
          - 40e9380490e748672c2522eaaeb692f7 # ATVP
          - 84272245b2988854bfb76a16e60baea5 # DSNP
          - 509e5f41146e278f9eab1ddaceb34515 # HBO
          - 5763d1b0ce84aff3b21038eea8e9b8ad # HMAX
          - 526d445d4c16214309f0fd2b3be18a89 # Hulu
          - e0ec9672be6cac914ffad34a6b077209 # iT
          - 6a061313d22e51e0f25b7cd4dc065233 # MAX
          - 170b1d363bd8516fbf3a3eb05d4faff6 # NF
          - c9fd353f8f5f1baf56dc601c4cb29920 # PCOK
          - e36a0ba1bc902b26ee40818a1d59b8bd # PMTP
        assign_scores_to:
          - name: Perfeccionista

