name: pi-services
# Stack multimedia.
#
# Sube junto con el resto del stack, con el mismo `docker compose up -d` de la raiz.
#
#
# Las variables del contenedor van por env_file, igual que el resto del repo.
# DAS_ROOT lleva valor por defecto porque se interpola al parsear: sin eso,
# el compose raiz no seria valido hasta que exista media/.env.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # Por lo mismo que homepage: tiene healthcheck y su PID 1 es el propio
    # Jellyfin, que tampoco hace de init. Hoy no acumula zombies, pero es el
    # mismo patron y la linea no cuesta nada.
    init: true
    env_file:
      - .env
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Solo lectura: Jellyfin reproduce, no escribe en la biblioteca.
      - ${DAS_ROOT:-/mnt/das}/media:/media:ro
    devices:
      # Decodificacion por hardware. Requiere el grupo render, ver README.
      - /dev/dri:/dev/dri
    # La excepcion a "nada se publica al host, todo entra por Caddy".
    #
    # Las apps de Jellyfin de tele y celular hablan DIRECTO con el servidor por
    # su puerto: no mandan el nombre del host, asi que Caddy -que enruta por
    # nombre- les contesta 403. En una Google TV el error es este, y no dice en
    # ningun lado que el problema sea el proxy:
    #
    #   http://192.168.68.66:8096  - Connection timed out
    #   http://192.168.68.66       - Unable to connect
    #   https://192.168.68.66      - SSL handshake failed
    #
    # Se podria resolver apuntando el DNS de cada aparato al Pi-hole para que
    # resuelva jellyfin.pi, pero eso obliga a poner IP fija en cada tele y los
    # aparatos de Google suelen ignorar el DNS que uno configura.
    #
    # Publicarlo no deja nada abierto sin proteger: Jellyfin tiene su propio
    # login, a diferencia de los *arr, que salen de fabrica sin contrasena y
    # por eso si dependen de Caddy.
    ports:
      - "8096:8096"
      # Descubrimiento automatico: con esto la app encuentra el servidor sola
      # en la red y no hay que tipear la IP en cada aparato.
      - "7359:7359/udp"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - .env
    volumes:
      - qbittorrent-config:/config
      # Solo las descargas, NO el disco entero como Radarr y Sonarr. Es el
      # unico contenedor que acepta datos de desconocidos: si alguna falla
      # suya diera ejecucion de codigo, lo unico que puede tocar es esta
      # carpeta, y no la biblioteca. La ruta de adentro es la misma
      # (/data/downloads) que ven Radarr y Sonarr, asi que no hace falta
      # ningun mapeo de rutas, y los hardlinks los hacen ellos, que si ven
      # los dos lados bajo un mismo montaje.
      - ${DAS_ROOT:-/mnt/das}/downloads:/data/downloads
    # Solo en la red de torrents, NO en la del resto del stack. Es el unico
    # contenedor que acepta datos de desconocidos, asi que es el que menos
    # conviene tener al lado de los otros veinte. Los que si le hablan -Radarr,
    # Sonarr, Caddy y la homepage- estan tambien en esa red.
    networks:
      - torrent
    # Que no pueda ganar privilegios aunque algo lo intente, y sin ninguna de
    # las capacidades de root salvo las cinco que necesita el arranque de la
    # imagen de linuxserver para cambiar de usuario y ordenar permisos. Sin
    # esto un fallo en qBittorrent le da al atacante todo lo que root puede
    # hacer adentro del contenedor.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      # Unico puerto publicado del stack: conexiones entrantes de pares.
      # La WebUI NO se publica, va por Caddy como todo lo demas.
      #
      # QBIT_ESCUCHA decide quien lo puede alcanzar. Por defecto es 127.0.0.1:
      # nadie desde afuera de esta maquina, ni siquiera de la red local, que es
      # el estado "cerrado". El instalador lo pasa a 0.0.0.0 solo si elegis
      # abrirlo. Publicarlo no alcanza para que llegue gente de internet: falta
      # reenviar el puerto en el router. Ver media/README.md.
      - "${QBIT_ESCUCHA:-127.0.0.1}:${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}"
      - "${QBIT_ESCUCHA:-127.0.0.1}:${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}/udp"
    restart: unless-stopped

  # Varios indexers -1337x, TorrentGalaxy, DonTorrent- estan detras de
  # Cloudflare, y Prowlarr solo no los puede consultar: la busqueda falla con
  # "blocked by CloudFlare Protection" aunque el indexer este bien configurado.
  # FlareSolverr resuelve ese desafio con un navegador headless y le devuelve
  # la cookie a Prowlarr.
  #
  # No expone puerto al host ni necesita volumen: Prowlarr le habla por la red
  # interna del compose, en http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    env_file:
      - .env
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    env_file:
      - .env
    volumes:
      - prowlarr-config:/config
    depends_on:
      - flaresolverr
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - .env
    volumes:
      - radarr-config:/config
      # El DAS entero, no subcarpetas sueltas: descargas y biblioteca tienen
      # que estar bajo el mismo montaje para que los hardlinks funcionen.
      - ${DAS_ROOT:-/mnt/das}:/data
      # El gancho que anota cada importacion. No manda nada y no sabe que
      # existe ntfy: solo escribe una linea. Quien avisa es el host, para que
      # el nombre del canal nunca entre a un contenedor. Ver avisar-import.sh.
      - ./avisar-import.sh:/scripts/avisar-import.sh:ro
      - ../datos/media-pendiente:/avisos
    depends_on:
      - prowlarr
      - qbittorrent
    # En las dos redes: la de siempre y la de torrents, que es por donde
    # le habla a qBittorrent.
    networks:
      - default
      - torrent
    restart: unless-stopped

  # Sonarr es a las series lo que Radarr a las peliculas: mismo motor, misma
  # forma de configurarse, y comparte indexers y cliente de descargas. Va
  # aparte y no como un modo de Radarr porque las series tienen temporadas,
  # episodios y calendario de emision, que son otro problema.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - .env
    volumes:
      - sonarr-config:/config
      # El DAS entero, igual que Radarr: descargas y biblioteca tienen que
      # compartir montaje o se pierden los hardlinks.
      - ${DAS_ROOT:-/mnt/das}:/data
      # Mismo gancho que Radarr, mismo archivo compartido: por eso un pack de
      # temporada y una pelicula que entran juntos salen bien agrupados.
      - ./avisar-import.sh:/scripts/avisar-import.sh:ro
      - ../datos/media-pendiente:/avisos
    depends_on:
      - prowlarr
      - qbittorrent
    # En las dos redes: la de siempre y la de torrents, que es por donde
    # le habla a qBittorrent.
    networks:
      - default
      - torrent
    restart: unless-stopped

  # Pedir peliculas y series desde el celular, en una sola pantalla, y que se
  # las pase a Radarr o a Sonarr segun corresponda.
  #
  # Ojo con el nombre: el proyecto se llamaba Jellyseerr y se renombro a Seerr.
  # La imagen vieja fallenbagel/jellyseerr sigue existiendo en Docker Hub y baja
  # sin error, pero quedo congelada en agosto de 2025: no falla, simplemente te
  # deja un ano atras. La vigente es esta.
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    # Segunda excepcion a "todo entra por Caddy", igual que Jellyfin: las apps de
    # tele (Seerr en Android TV) no usan Pi-hole como DNS, asi que no resuelven
    # seerr.pi y se conectan por IP a 192.168.68.66:5055. Seerr tiene su propio
    # login, asi que publicarlo no deja nada sin proteger.
    ports:
      - "5055:5055"
    env_file:
      - .env
    environment:
      - PORT=5055
      # De fabrica arranca en debug y escribe DOS archivos de log rotativos a la
      # vez, con un trabajo que corre cada 60 segundos. Sobre una microSD eso es
      # un chorro constante de escritura para nada.
      - LOG_LEVEL=info
    volumes:
      # Volumen nombrado y no bind mount a proposito: la imagen corre como el
      # usuario node y el volumen hereda ese dueno solo. Con un bind mount hay
      # que acordarse del chown, y si te olvidas Seerr arranca igual y despues
      # falla al guardar, sin decir que es un permiso.
      - seerr-config:/app/config
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - bazarr-config:/config
      - ${DAS_ROOT:-/mnt/das}:/data
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  qbittorrent-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  seerr-config:
  bazarr-config:

networks:
  default:
    name: pi-services
    external: true
  torrent:
    name: pi-torrent
    external: true
