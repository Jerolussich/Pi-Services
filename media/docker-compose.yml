name: pi-services
# Stack multimedia.
#
# Sube junto con el resto del stack, con el mismo `docker compose up -d` de la raiz.
#
#
# Las variables del contenedor van por env_file, igual que el resto del repo.
# DAS_ROOT lleva valor por defecto porque se interpola al parsear: sin eso,
# el compose raiz no seria valido hasta que exista media/.env.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    env_file:
      - .env
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Solo lectura: Jellyfin reproduce, no escribe en la biblioteca.
      - ${DAS_ROOT:-/mnt/das}/media:/media:ro
    devices:
      # Decodificacion por hardware. Requiere el grupo render, ver README.
      - /dev/dri:/dev/dri
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - .env
    volumes:
      - qbittorrent-config:/config
      - ${DAS_ROOT:-/mnt/das}:/data
    ports:
      # Unico puerto publicado del stack: conexiones entrantes de pares.
      # La WebUI NO se publica, va por Caddy como todo lo demas.
      - ${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}
      - ${QBIT_TORRENT_PORT:-6881}:${QBIT_TORRENT_PORT:-6881}/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    env_file:
      - .env
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - .env
    volumes:
      - radarr-config:/config
      # El DAS entero, no subcarpetas sueltas: descargas y biblioteca tienen
      # que estar bajo el mismo montaje para que los hardlinks funcionen.
      - ${DAS_ROOT:-/mnt/das}:/data
      # El gancho que anota cada importacion. No manda nada y no sabe que
      # existe ntfy: solo escribe una linea. Quien avisa es el host, para que
      # el nombre del canal nunca entre a un contenedor. Ver avisar-import.sh.
      - ./avisar-import.sh:/scripts/avisar-import.sh:ro
      - ../datos/media-pendiente:/avisos
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped

  # Sonarr es a las series lo que Radarr a las peliculas: mismo motor, misma
  # forma de configurarse, y comparte indexers y cliente de descargas. Va
  # aparte y no como un modo de Radarr porque las series tienen temporadas,
  # episodios y calendario de emision, que son otro problema.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - .env
    volumes:
      - sonarr-config:/config
      # El DAS entero, igual que Radarr: descargas y biblioteca tienen que
      # compartir montaje o se pierden los hardlinks.
      - ${DAS_ROOT:-/mnt/das}:/data
      # Mismo gancho que Radarr, mismo archivo compartido: por eso un pack de
      # temporada y una pelicula que entran juntos salen bien agrupados.
      - ./avisar-import.sh:/scripts/avisar-import.sh:ro
      - ../datos/media-pendiente:/avisos
    depends_on:
      - prowlarr
      - qbittorrent
    restart: unless-stopped

  # Pedir peliculas y series desde el celular, en una sola pantalla, y que se
  # las pase a Radarr o a Sonarr segun corresponda.
  #
  # Ojo con el nombre: el proyecto se llamaba Jellyseerr y se renombro a Seerr.
  # La imagen vieja fallenbagel/jellyseerr sigue existiendo en Docker Hub y baja
  # sin error, pero quedo congelada en agosto de 2025: no falla, simplemente te
  # deja un ano atras. La vigente es esta.
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    env_file:
      - .env
    environment:
      - PORT=5055
      # De fabrica arranca en debug y escribe DOS archivos de log rotativos a la
      # vez, con un trabajo que corre cada 60 segundos. Sobre una microSD eso es
      # un chorro constante de escritura para nada.
      - LOG_LEVEL=info
    volumes:
      # Volumen nombrado y no bind mount a proposito: la imagen corre como el
      # usuario node y el volumen hereda ese dueno solo. Con un bind mount hay
      # que acordarse del chown, y si te olvidas Seerr arranca igual y despues
      # falla al guardar, sin decir que es un permiso.
      - seerr-config:/app/config
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - bazarr-config:/config
      - ${DAS_ROOT:-/mnt/das}:/data
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  qbittorrent-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  seerr-config:
  bazarr-config:
