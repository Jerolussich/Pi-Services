services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - 80:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Log de acceso en ruta fija del host, para que fail2ban no dependa
      # del ID del contenedor y sobreviva a cada recreacion.
      - /var/log/caddy:/var/log/caddy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
