name: pi-services
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - 80:80
      # HTTPS con el certificado que emite Tailscale para el nombre de esta
      # maquina en la tailnet. Se publica siempre aunque no haya certificado:
      # sin el archivo en extra/ no hay ningun bloque que escuche el 443, y un
      # puerto publicado sin nadie detras no hace nada.
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Lo que el instalador genera segun esta maquina. El Caddyfile lo importa
      # con un comodin, que no falla si la carpeta esta vacia.
      - ./extra:/etc/caddy/extra:ro
      # Los certificados de Tailscale, de solo lectura
      - /var/lib/pi-services/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      # Log de acceso en ruta fija del host, para que fail2ban no dependa
      # del ID del contenedor y sobreviva a cada recreacion.
      - /var/log/caddy:/var/log/caddy
      # El feed de eventos en eventos.pi. Son dos montajes de solo lectura y
      # ningun servicio nuevo: la pagina es un archivo estatico y el feed es
      # un texto plano que escribe el diagnostico.
      - ./site:/srv/site:ro
      - ../datos:/srv/datos:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
